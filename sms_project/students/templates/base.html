<!DOCTYPE html>
<html>
<head>
{% load static %}

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Management System</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="{% static 'students/css/style.css' %}">
<script>
tailwind.config = {
    theme: {
        extend: {
            fontFamily: {
                display: ['Sora', 'sans-serif'],
            },
        }
    }
}
</script>

</head>

<body class="font-display text-slate-800 bg-slate-100 overflow-x-hidden">

<div class="fixed inset-0 -z-10 bg-[radial-gradient(circle_at_top_left,_#ecfeff,_#f8fafc_35%,_#f1f5f9)]"></div>

<nav class="relative border-b border-slate-200 bg-white/80 backdrop-blur-md sticky top-0 z-50">
<div class="mx-auto flex w-full max-w-6xl items-center justify-between px-4 py-4">

<a class="flex items-center gap-2 text-lg font-bold tracking-tight text-slate-900" href="/">
<img src="{% static 'students/images/logo.svg' %}" alt="Logo" class="brand-logo">
<span class="hidden sm:inline">Student Management</span>
<span class="sm:hidden">SMS</span>
</a>

<!-- Mobile Menu Button -->
<button id="mobile-menu-button" class="flex h-10 w-10 items-center justify-center rounded-xl bg-slate-50 text-slate-600 transition-colors hover:bg-slate-100 md:hidden">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
    </svg>
</button>

<!-- Desktop Menu -->
<div id="nav-menu" class="absolute inset-x-0 top-full hidden flex-col gap-2 border-b border-slate-200 bg-white p-4 shadow-xl md:static md:flex md:flex-row md:items-center md:border-none md:bg-transparent md:p-0 md:shadow-none z-50">
    <a data-nav="home" href="/" class="rounded-full border border-slate-300 bg-white px-4 py-1.5 text-sm font-medium text-slate-700 transition hover:border-slate-400 hover:bg-slate-50">Home</a>
    <a data-nav="create" href="/create/" class="rounded-full bg-emerald-600 px-4 py-1.5 text-sm font-semibold text-white shadow-sm transition hover:bg-emerald-700">Add Student</a>
    <a data-nav="students" href="/students/" class="rounded-full border border-emerald-300 bg-emerald-50 px-4 py-1.5 text-sm font-medium text-emerald-700 transition hover:bg-emerald-100">List</a>
    {% if user.is_authenticated %}
    <a data-nav="dashboard" href="/dashboard/" class="rounded-full border border-sky-300 bg-sky-50 px-4 py-1.5 text-sm font-medium text-sky-700 transition hover:bg-sky-100">Dash</a>
    <a data-nav="logout" href="/logout/" class="rounded-full border border-rose-300 bg-rose-50 px-4 py-1.5 text-sm font-medium text-rose-700 transition hover:bg-rose-100">Logout</a>
    {% else %}
    <a data-nav="login" href="/login/" class="rounded-full border border-sky-300 bg-sky-50 px-4 py-1.5 text-sm font-medium text-sky-700 transition hover:bg-sky-100">Login</a>
    <a data-nav="register" href="/register/" class="rounded-full border border-purple-300 bg-purple-50 px-4 py-1.5 text-sm font-medium text-purple-700 transition hover:bg-purple-100">Register</a>
    {% endif %}
</div>

</div>
</nav>

<div class="mx-auto mt-6 w-full max-w-6xl px-4 pb-10">
{% if messages %}
{% for message in messages %}
<div class="mb-3 rounded-2xl border px-4 py-3 text-sm font-medium
{% if message.tags == 'success' %}border-emerald-200 bg-emerald-50 text-emerald-700{% endif %}
{% if message.tags == 'error' %}border-rose-200 bg-rose-50 text-rose-700{% endif %}
{% if message.tags == 'warning' %}border-amber-200 bg-amber-50 text-amber-700{% endif %}
{% if message.tags == 'info' %}border-sky-200 bg-sky-50 text-sky-700{% endif %}
">
{{message}}
</div>

{% endfor %}
{% endif %}
{% block content %}

{% endblock %}

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const menuButton = document.getElementById("mobile-menu-button");
    const navMenu = document.getElementById("nav-menu");
    if (menuButton && navMenu) {
        menuButton.addEventListener("click", function () {
            navMenu.classList.toggle("hidden");
            navMenu.classList.toggle("flex");
        });
    }
});
</script>
<script src="{% static 'students/js/script.js' %}"></script>
</body>
</html>

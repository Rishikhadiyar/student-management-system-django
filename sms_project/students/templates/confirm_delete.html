{% extends "base.html" %}

{% block content %}

<section class="space-y-6">
    <div class="relative overflow-hidden rounded-[2rem] border border-slate-200 bg-white/90 p-7 shadow-xl shadow-slate-200/70">
        <div class="pointer-events-none absolute -right-16 -top-16 h-40 w-40 rounded-full bg-rose-200/60 blur-2xl"></div>
        <div class="pointer-events-none absolute -bottom-16 -left-12 h-36 w-36 rounded-full bg-amber-200/50 blur-2xl"></div>

        <div class="relative flex flex-wrap items-center justify-between gap-4">
            <div>
                <span class="inline-block rounded-full border border-rose-200 bg-rose-50 px-3 py-1 text-xs font-semibold uppercase tracking-wider text-rose-700">
                    Delete Confirmation
                </span>
                <h1 class="mt-3 text-3xl font-extrabold tracking-tight text-slate-900">Delete Student Record?</h1>
                <p class="mt-1 text-sm text-slate-600">
                    This action permanently removes <span class="font-semibold text-slate-800">{{ object.name }}</span> from the directory.
                </p>
            </div>
            <a href="{% url 'student_list' %}" class="inline-flex items-center justify-center rounded-2xl border border-slate-300 bg-white px-5 py-3 text-sm font-bold text-slate-700 transition hover:bg-slate-50">
                Back to List
            </a>
        </div>
    </div>

    <div class="overflow-hidden rounded-[2rem] border border-slate-200 bg-white/90 p-7 shadow-xl shadow-slate-200/70">
        <form method="POST" class="flex flex-wrap gap-3">
            {% csrf_token %}
            <button type="submit" class="inline-flex items-center justify-center rounded-2xl bg-rose-600 px-5 py-3 text-sm font-bold text-white shadow-lg shadow-rose-200 transition hover:bg-rose-700">
                Yes, Delete
            </button>
            <a href="{% url 'student_list' %}" class="inline-flex items-center justify-center rounded-2xl border border-slate-300 bg-white px-5 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-50">
                Cancel
            </a>
        </form>
    </div>
</section>

{% endblock %}

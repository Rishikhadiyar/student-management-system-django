{% extends "base.html" %}

{% block content %}

<div class="flex justify-center items-center mt-10">
    <div class="bg-white shadow-lg rounded-lg p-6 w-full max-w-md">

        <h2 class="text-2xl font-bold text-center mb-6 text-gray-700">
            Add Student
        </h2>

        <form method="POST" class="space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-medium text-gray-600">Name</label>
                <input type="text" name="name" class="w-full mt-1 p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-600">Email</label>
                <input type="email" name="email" class="w-full mt-1 p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-600">Age</label>
                <input type="number" name="age" class="w-full mt-1 p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-600">Course</label>
                <input type="text" name="course" class="w-full mt-1 p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>

            <button type="submit" class="w-full bg-green-500 text-white py-2 rounded hover:bg-green-600 transition">
                Save Student
            </button>

        </form>

    </div>
</div>

{% endblock %}

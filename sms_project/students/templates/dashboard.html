{% extends "base.html" %}

{% block content %}
<section class="space-y-6">
    <div class="relative overflow-hidden rounded-[2rem] border border-slate-200 bg-white/90 p-7 shadow-xl shadow-slate-200/70">
        <div class="pointer-events-none absolute -right-16 -top-16 h-40 w-40 rounded-full bg-sky-200/60 blur-2xl"></div>
        <div class="pointer-events-none absolute -bottom-16 -left-12 h-36 w-36 rounded-full bg-emerald-200/50 blur-2xl"></div>
        <div class="relative">
            <span class="inline-block rounded-full border border-sky-200 bg-sky-50 px-3 py-1 text-xs font-semibold uppercase tracking-wider text-sky-700">Protected Page</span>
            <h1 class="mt-3 text-3xl font-extrabold tracking-tight text-slate-900">Welcome {{ user.username }}</h1>
            <p class="mt-1 text-sm text-slate-600">This dashboard is accessible only after login.</p>
        </div>
    </div>

    <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
        <a href="{% url 'student_list' %}" class="block rounded-3xl border border-slate-200 bg-white/90 p-6 shadow-lg shadow-slate-200/60 transition hover:-translate-y-1 hover:border-emerald-200 hover:shadow-emerald-100/50">
            <p class="text-xs font-semibold uppercase tracking-wider text-slate-500">Total Students</p>
            <p class="mt-3 text-4xl font-extrabold text-emerald-700">{{ total_students }}</p>
        </a>
        <a href="{% url 'add_course' %}" class="block rounded-3xl border border-slate-200 bg-white/90 p-6 shadow-lg shadow-slate-200/60 transition hover:-translate-y-1 hover:border-sky-200 hover:shadow-sky-100/50">
            <p class="text-xs font-semibold uppercase tracking-wider text-slate-500">Total Courses</p>
            <p class="mt-3 text-4xl font-extrabold text-sky-700">{{ total_courses }}</p>
        </a>
    </div>
</section>
{% endblock %}

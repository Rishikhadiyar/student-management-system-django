{% extends "base.html" %}

{% block content %}
<section class="mx-auto max-w-2xl space-y-6">
    <div class="relative overflow-hidden rounded-[2rem] border border-slate-200 bg-white/90 p-7 shadow-xl shadow-slate-200/70">
        <div class="pointer-events-none absolute -right-16 -top-16 h-40 w-40 rounded-full bg-sky-200/60 blur-2xl"></div>
        <div class="pointer-events-none absolute -bottom-16 -left-12 h-36 w-36 rounded-full bg-emerald-200/50 blur-2xl"></div>
        <div class="relative">
            <span class="inline-block rounded-full border border-sky-200 bg-sky-50 px-3 py-1 text-xs font-semibold uppercase tracking-wider text-sky-700">Authentication</span>
            <h1 class="mt-3 text-3xl font-extrabold tracking-tight text-slate-900">Login</h1>
            <p class="mt-1 text-sm text-slate-600">Sign in to access protected dashboard pages.</p>
        </div>
    </div>

    <div class="overflow-hidden rounded-[2rem] border border-slate-200 bg-white/90 p-7 shadow-xl shadow-slate-200/70">
        <form method="POST" class="space-y-5" novalidate>
            {% csrf_token %}
            {% for field in form %}
            <div>
                <label for="{{ field.id_for_label }}" class="mb-2 block text-sm font-semibold text-slate-700">{{ field.label }}</label>
                <input
                    type="{% if 'password' in field.name %}password{% else %}text{% endif %}"
                    name="{{ field.name }}"
                    id="{{ field.id_for_label }}"
                    value="{% if 'password' not in field.name %}{{ field.value|default_if_none:'' }}{% endif %}"
                    class="w-full rounded-2xl border border-slate-300 bg-white/90 px-4 py-3 text-sm font-medium text-slate-800 shadow-sm outline-none transition placeholder:text-slate-400 focus:border-sky-500 focus:ring-4 focus:ring-sky-100"
                >
                {% if field.errors %}
                <p class="mt-1 text-sm font-medium text-rose-600">{{ field.errors|striptags }}</p>
                {% endif %}
            </div>
            {% endfor %}
            <div class="flex flex-wrap items-center gap-3">
                <button type="submit" class="rounded-2xl bg-sky-600 px-6 py-3 text-sm font-bold text-white shadow-lg shadow-sky-200 transition hover:bg-sky-700">
                    Login
                </button>
                <a href="{% url 'register' %}" class="rounded-2xl border border-slate-300 bg-white px-5 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-50">
                    Create account
                </a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
